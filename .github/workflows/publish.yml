name: Publish to npm and GitHub Releases

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install

      - name: Build packages
        run: npm run build


      - name: Publish @a11yfred/neighbor to npm
        run: |
          cd packages/neighbor
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @a11yfred/textlint-rule-neighbor to npm
        run: |
          cd packages/textlint-rule-neighbor
          npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Package Vale Rules
        run: |
          cd packages/vale-config-neighbor/vale
          zip -r neighbor.zip neighbor/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: packages/vale-config-neighbor/vale/neighbor.zip
          generate_release_notes: true
