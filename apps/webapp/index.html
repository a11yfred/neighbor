<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neighbor Web: Accessible and Inclusive Writing Assistant</title>
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Improve accessibility in your writing. Scan and edit your text to find and replace ableist language, disability metaphors, and opaque idioms." />
    <meta name="author" content="A11yFred Project" />
    <meta name="robots" content="index, follow" />
    
    <!-- Google Fonts: Inter and Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    
    <!-- Color scheme preference for all browsers -->
    <meta name="color-scheme" content="light dark" />
    
    <!-- Blocking theme init: applies saved theme before first paint to prevent flash -->
    <script>
      (function () {
        var theme = localStorage.getItem('theme') || 'auto'
        var resolved = theme === 'auto'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : theme
        document.documentElement.setAttribute('data-theme', resolved)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
