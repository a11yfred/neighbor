custom_rules:
  redundant_accessibility_label:
    name: "Redundant Accessibility Label"
    regex: '(?i)\.accessibilityLabel\(\s*(?:Text\(\s*)?"[^"]*\b(button|link|heading|checkbox|switch|radio|enabled|disabled|selected|checked|ticked|unticked|dimmed|toggle)\b[^"]*"\s*\)?\s*\)'
    message: "Screen readers announce traits natively in the user's localized language/dialect. Do not hardcode roles (button, link) or states (enabled, ticked, selected) into the accessibility label. Use .accessibilityAddTraits() or .accessibilityValue() instead."
    severity: warning

  disabled_focus_effect:
    name: "Disabled Focus Effect"
    regex: '\.focusEffectDisabled\(\s*(?:true)?\s*\)'
    message: "Disabling the focus effect hurts keyboard users on iPadOS and tvOS (WCAG 2.4.7 Focus Visible). Ensure a custom high-contrast focus state is provided if this is intentional."
    severity: warning

  restrictive_orientation_lock:
    name: "Restrictive Orientation Lock"
    regex: '(?:supportedInterfaceOrientations\s*(?:{|->)\s*(?:return\s*)?\.portrait|interfaceOrientations:\s*\.portrait)'
    message: "Locking the app to a single orientation (portrait) violates WCAG 1.3.4 (Orientation). Users with mounted devices need support for both portrait and landscape modes unless orientation is strictly essential."
    severity: warning

  redundant_accessibility_hidden:
    name: "Redundant Accessibility Hidden"
    regex: 'Image\(\s*decorative:[^\)]*\)\s*(?:\.[^\s(]+\([^\)]*\)\s*)*\.accessibilityHidden\(\s*true\s*\)'
    message: "Using .accessibilityHidden(true) on an Image already marked as decorative is redundant and confusing code duplication."
    severity: warning

  # Off by default (Opt-in)
  # forced_light_mode:
  #   name: "Forced Light Mode"
  #   regex: '\.preferredColorScheme\(\s*\.light\s*\)'
  #   message: "Forcing light mode prevents users from using Dark Mode, which is essential for users with light sensitivity or photophobia. Support both modes if possible."
  #   severity: warning

  hardcoded_content_violation:
    name: "Hardcoded Content Violation"
    regex: '(?i)\.accessibilityLabel\(\s*(?:Text\(\s*)?"[^"]*\b(click here|swipe left|swipe right|tap here|see below|blind to|crazy|insane|dumb|crippled)\b[^"]*"\s*\)?\s*\)'
    message: "Content violation: Do not use confusing directional CTAs ('click here') or non-inclusive language in accessibility labels. Prefer descriptive actions and inclusive language."
    severity: warning

  hardcoded_font_size:
    name: "Hardcoded Font Size"
    regex: '\.font\(\s*\.system\(\s*size:'
    message: "Hardcoded system sizes do not respond to Dynamic Type scaling by default (WCAG 1.4.4 Resize Text). Use semantic fonts like .body, or use relative scaling."
    severity: warning

  text_fixed_size:
    name: "Text Fixed Size"
    regex: '\.fixedSize\([^\)]*\)'
    message: "Applying .fixedSize() prevents text from wrapping or expanding when users increase their system font size, causing truncation (WCAG 1.4.4 Resize Text)."
    severity: warning

  small_touch_target:
    name: "Small Touch Target"
    regex: '\.frame\(\s*(?:width|height):\s*(?:[0-9]|[1-3][0-9]|4[0-3])(?:\.[0-9]+)?\s*(?:,|\))'
    message: "Interactive elements must have a minimum touch target of 44x44pt (WCAG 2.5.8 Target Size). Increase the frame size or padding."
    severity: warning
